services:
  - type: worker
    name: eci-scraper
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u scraper.py
    envVars:
      - key: ELECTION_URL_PREFIX
        value: ResultAcGenMay2026
      - key: ELECTION_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: DELAY_BETWEEN_REQUESTS
        default: "1.0"
